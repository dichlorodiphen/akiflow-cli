name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Extend this list to exercise additional host timezones.
        os: [ubuntu-latest, macos-latest]
        timezone: [UTC, America/Los_Angeles]
    env:
      TZ: ${{ matrix.timezone }}
      AF_API_BASE: http://127.0.0.1:1
      AF_REFRESH_URL: http://127.0.0.1:1/oauth/refreshToken
      AF_NO_AUTO_SYNC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Matches the Bun version used for local verification.
          bun-version: "1.3.14"
      - name: Isolate CLI config and cache
        shell: bash
        run: |
          echo "AF_CONFIG_DIR=$RUNNER_TEMP/af-ci-config" >> "$GITHUB_ENV"
          echo "AF_CACHE_DIR=$RUNNER_TEMP/af-ci-cache" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Biome check (no writes)
        run: bunx biome check .
      - name: Full unit suite (including version)
        run: bun run test:unit
      - name: Full integration suite
        run: bun run test:integration
      - name: Compiled binary smoke check
        run: bun run test:smoke
